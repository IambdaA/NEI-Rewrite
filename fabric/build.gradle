plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap' version '1.18.3'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Minecraft 1.20.1 runs on Java 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// The shared code (plain Minecraft code) is compiled into this jar together with the Fabric glue in this module.
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    // JEI's API (for the JEI recipe bridge, codechicken.nei.jei)
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

// Without JEI (jei_version=none) the JEI bridge package is not compiled
if (jei_version == 'none') {
    sourceSets.main.java.exclude('codechicken/nei/jei/**')
}

loom {
    // mojmap, like the Forge module (and the shared code)
    accessWidenerPath = file('src/main/resources/notenoughitems.accesswidener')
    mixin {
        defaultRefmapName = 'notenoughitems.refmap.json'
    }
    runs {
        client {
            client()
            ideConfigGenerated true
        }
        server {
            server()
            ideConfigGenerated true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // The JEI recipe bridge reads the recipes of every mod that has a JEI plugin. Only the API is needed to compile (JEI's
    // Fabric jars are intermediary-mapped: Loom remaps them); the full JEI runs in the dev client only.
    if (jei_version != 'none') {
        modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api-intermediary:${jei_version}"
        modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    }
}

processResources {
    var props = [
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            minecraft_version     : minecraft_version,
            fabric_loader_min     : fabric_loader_min,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
