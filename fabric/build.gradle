plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// The shared code (plain Minecraft code) is compiled into this jar together with the Fabric glue in this module.
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    // JEI's API (for the JEI recipe bridge, codechicken.nei.jei)
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

// Without JEI (jei_version=none) the JEI bridge package is not compiled
if (jei_version == 'none') {
    sourceSets.main.java.exclude('codechicken/nei/jei/**')
}

// Dev-only test driver (src/smoketest): used by the smokeTest run below, never part of the published jar.
sourceSets {
    smoketest {
        java.srcDir '../common/src/smoketest/java' // the loader-neutral driver (SmokeCore)
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

// The same driver as a jar for test copies of Prism instances (26.x is not obfuscated: no remapping).
// ./gradlew :fabric:smoketestJar -> fabric/build/libs/nei-smoketest-fabric-<mc>-<version>.jar
tasks.register('smoketestJar', Jar) {
    from sourceSets.smoketest.output
    archiveBaseName = "nei-smoketest-fabric-${minecraft_version}"
}

loom {
    // 26.x is not obfuscated: no mappings, no remapping (Mojang's own names)
    accessWidenerPath = file('src/main/resources/notenoughitems.accesswidener')

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        nei_smoketest { sourceSet sourceSets.smoketest }
    }

    // ./gradlew :fabric:runSmokeTest -Pnei.smoketest.script=<file>  (see smoketest/README.md in the tree root)
    runs {
        smokeTest {
            client()
            name = 'NEI Smoke Test'
            source sourceSets.smoketest
            runDir = 'run-smoketest'
            programArgs '--width', '1280', '--height', '720'
            if (project.hasProperty('nei.smoketest.script')) {
                vmArg "-Dnei.smoketest.script=${file(project.property('nei.smoketest.script')).absolutePath}"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // The JEI recipe bridge reads the recipes of every mod that has a JEI plugin. Only the API is needed to compile;
    // the full JEI is on the dev client's runtime classpath only (it is not a dependency of the published mod).
    if (jei_version != 'none') {
        compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
        compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
        runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    }
}

processResources {
    var props = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
