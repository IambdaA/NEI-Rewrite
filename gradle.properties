org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---- Minecraft / loaders (1.20.1) ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

# Forge 1.20.1 is the 47.x line (https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html). This is the
# version the dev client runs; the finished mod accepts every 47.x from forge_version_range on.
forge_version=47.4.23
forge_version_range=[47.1.0,)

# JEI for 1.20.1 (the file name on Modrinth reads jei-1.20.1-<loader>-<version>.jar). The bridge reads recipes through JEI's
# API. "15.+" takes the newest JEI 15; put the exact version here to pin it. "none" builds NEI without the JEI bridge
# (the codechicken.nei.jei package is left out and the dev client has no JEI).
jei_version=15.+
# The JEI versions the finished mod accepts (the dependency is optional)
jei_version_range=[15.20.0,)

# Fabric: loader and API. The dev client uses the versions JEI itself is built with (JEI refuses to start on an older
# loader); the finished mod only needs fabric_loader_min.
fabric_loader_version=0.19.4
fabric_loader_min=0.15.0
fabric_api_version=0.92.11+1.20.1

# ---- Mod ----
mod_id=notenoughitems
mod_name=NEI Rewrite
mod_license=LGPL-3.0-or-later
mod_version=1.3.1
mod_group_id=codechicken.nei
mod_authors=Iambda
