org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---- Minecraft / loaders (26.1.2 only: JEI, the NEI bridge's host, has no 26.1 or 26.1.1 build) ----
# the version the code is compiled against
minecraft_version=26.1.2
# what the finished mod accepts
minecraft_version_range=[26.1.2]
# the name used in the jar file names
minecraft_label=26.1.2

# NeoForge: must agree with the Minecraft version (https://projects.neoforged.net/neoforged/neoforge)
neo_version=26.1.2.114
# The oldest NeoForge the finished mod accepts
neo_version_range=[26.1.2.0,)

# Fabric: loader and API (the Gradle plugin that builds Fabric mods is net.fabricmc.fabric-loom, see fabric/build.gradle)
fabric_loader_version=0.19.4
fabric_api_version=0.154.2+26.1.2

# JEI (file name on Modrinth: jei-26.1.2-<loader>-<version>.jar). "none" builds NEI without the JEI bridge: the
# codechicken.nei.jei package is left out and the dev client has no JEI.
jei_version=29.53.0.114
# The JEI versions the finished mod accepts (the dependency is optional)
jei_version_range=[29.0.0,)

# ---- Mod ----
mod_id=notenoughitems
mod_name=NEI Rewrite
mod_license=LGPL-3.0-or-later
mod_version=1.1.2
mod_group_id=codechicken.nei
mod_authors=Iambda
