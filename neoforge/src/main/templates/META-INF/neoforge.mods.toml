license="${mod_license}"
# Add issueTrackerURL="<your issues page>" here and displayURL="<your project page>" below once the repository is public
# (left out on purpose: a made-up link would be worse than none)

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
iconFile="logo.png"
authors="${mod_authors}"
credits="Based on NotEnoughItems by Chicken-Bones and the GTNH fork by mitchej123 and the GTNH team (https://github.com/GTNewHorizons/NotEnoughItems, LGPL-3.0-or-later). Parts of the search and panel design come from JustEnoughItems by mezz (https://github.com/mezz/JustEnoughItems, MIT)."
description='''
NEI Rewrite is an unofficial rewrite of the GTNH fork of NotEnoughItems (NEI) for NeoForge, made by Iambda.
It is new code, not the original 1.7.10 mod, and is based on NotEnoughItems by Chicken-Bones, mitchej123 and the GTNH team
(https://github.com/GTNewHorizons/NotEnoughItems, LGPL-3.0-or-later). Not affiliated with the GTNH team.

IMPORTANT: recipes of modded machines (AE2, Create, Mekanism ...) need JEI installed. NEI reads them from JEI's plugins
(JEI's own screens are turned off). Without JEI only vanilla recipes show.

Item panel with NEI search syntax, recipe and usage lookup, bookmarks with groups, todo lists and crafting trees,
recipe transfer, autocrafting, item subsets, cheat tools and more.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with JEI installed, NEI also shows the recipes of every mod that has a JEI plugin
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"
