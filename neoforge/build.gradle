plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // JEI's API (for the JEI recipe bridge, codechicken.nei.jei)
    maven {
        url = 'https://maven.blamejared.com'
        // JEI's config library (mezz_config) lives on the same maven; JEI's pom needs it at runtime
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

// Without JEI (jei_version=none) the JEI bridge package is not compiled
if (jei_version == 'none') {
    sourceSets.main.java.exclude('codechicken/nei/jei/**')
}

// The shared code (plain Minecraft code) is compiled into this jar together with the NeoForge glue in this module.
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

// Test driver (src/smoketest + ../common/src/smoketest): its own jar for test copies of Prism instances, never part of the
// published mod. NeoForge runs with Mojang names, so the plain jar works: ./gradlew :neoforge:smoketestJar
sourceSets {
    smoketest {
        java.srcDir '../common/src/smoketest/java'
        compileClasspath += main.compileClasspath
    }
}
tasks.register('smoketestJar', Jar) {
    from sourceSets.smoketest.output
    archiveBaseName = "nei-smoketest-neoforge-${minecraft_version}"
}

neoForge {
    version = project.neo_version
    // accesstransformer.cfg in src/main/resources/META-INF is picked up automatically

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Fills ${...} in src/main/templates (the mods.toml) from gradle.properties
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            jei_version_range      : jei_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 'localRuntime': like runtimeOnly, but not pulled in by dependents of this mod (the dev client gets the full JEI through it).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The JEI recipe bridge reads the recipes of every mod that has a JEI plugin. Only the API is needed to compile;
    // the full JEI goes to localRuntime so the dev client has it, and it is not a dependency of the published mod.
    if (jei_version != 'none') {
        compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
